services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: pointcloudlib-server
    container_name: pointcloudlib-server
    ports:
      - "5050:5050"
    networks:
      - pointcloudlib-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5050/api
    image: pointcloudlib-ui
    container_name: pointcloudlib-ui
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - pointcloudlib-net

networks:
  pointcloudlib-net:
    driver: bridge
